<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/quick-localtube.png" />

  <link rel="apple-touch-icon" href="/quick-localtube-bg.png" />
  <meta name="apple-mobile-web-app-title" content="Local Tube" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Local Tube</title>
</head>

<body class="theme-dark">
  <div id="root"></div>
  <!-- Seed the persisted theme before the app module loads to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('localtube:theme');
        if (t) document.body.className = 'theme-' + t;
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
